[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
startup_mode = "Maximized"

[font]
size = 13
builtin_box_drawing = true
offset = { x = 0, y = 1 }
glyph_offset = { x = 0, y = 0 }

[env]
TERM = "xterm-256color"

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Beam", blinking = "On" }
thickness = 0.2

[mouse]
hide_when_typing = true

[terminal.shell]
program = "/bin/bash"
args = ["-lc", "zellij"]


[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"
